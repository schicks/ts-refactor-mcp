name: Validate PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    environment: pr
    strategy:
      matrix:
        node-version: [20, 22, 24]
    
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check version is greater than latest release
        if: matrix.node-version == 24
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          LATEST_RELEASE_RAW=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
          
          if [ -z "$LATEST_RELEASE_RAW" ]; then
            echo "No releases found, skipping version check"
            echo "Current version: $CURRENT_VERSION"
          else
            LATEST_RELEASE=$(echo "$LATEST_RELEASE_RAW" | sed 's/^v//')
            echo "Current version: $CURRENT_VERSION"
            echo "Latest release: $LATEST_RELEASE"
            
            if ! npx --yes semver "$CURRENT_VERSION" -r ">$LATEST_RELEASE"; then
              echo "Error: package.json version ($CURRENT_VERSION) must be greater than latest release ($LATEST_RELEASE)"
              exit 1
            fi
            
            echo "✓ Version check passed"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: |
          cd __tests__/fixtures/simple-project && npm install
          cd ../../..
          npm test

      - name: Package acceptance test
        run: npm test -- package-acceptance.test.ts