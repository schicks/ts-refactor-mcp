name: Publish Canary Release

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr:
    runs-on: ubuntu-latest
    environment: pr

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check version is greater than latest release
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          LATEST_RELEASE=$(gh release view --json tagName -q .tagName 2>/dev/null | sed 's/^v//' || echo "0.0.0")
          
          echo "Current version: $CURRENT_VERSION"
          echo "Latest release: $LATEST_RELEASE"
          
          if ! npx --yes semver "$CURRENT_VERSION" -r ">$LATEST_RELEASE"; then
            echo "Error: package.json version ($CURRENT_VERSION) must be greater than latest release ($LATEST_RELEASE)"
            exit 1
          fi
          
          echo "✓ Version check passed"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: |
          cd __tests__/fixtures/simple-project && npm install
          cd ../../..
          npm test