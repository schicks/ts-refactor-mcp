name: Publish Canary Release

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  canary:
    runs-on: ubuntu-latest
    environment: canary

    permissions:
      contents: read
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Run tests
        run: |
          cd __tests__/fixtures/simple-project && npm install
          cd ../../..
          npm test

      - name: Build
        run: npm run build

      - name: Set canary version
        id: canary_version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          SHORT_SHA=$(git rev-parse --short HEAD)
          CANARY_VERSION="${CURRENT_VERSION}-canary.${{ github.event.pull_request.number }}.${SHORT_SHA}"
          echo "version=${CANARY_VERSION}" >> $GITHUB_OUTPUT
          npm version ${CANARY_VERSION} --no-git-tag-version

      - name: Publish canary to npm
        run: npm publish --tag canary --provenance --access public

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const canaryVersion = '${{ steps.canary_version.outputs.version }}';
            const body = `🚀 Canary release published: \`${canaryVersion}\`

            Install it with:
            \`\`\`bash
            npm install ts-refactor-mcp@${canaryVersion}
            \`\`\`

            Or try it directly:
            \`\`\`bash
            npx ts-refactor-mcp@${canaryVersion}
            \`\`\``;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
